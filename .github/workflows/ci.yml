name: CI

on:
  push:
    branches: [master, rim, production]
  pull_request:
    branches: [master, rim, production]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [14.x]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Check pinned dependencies
        run: node scripts/check-pinned-deps.js
        continue-on-error: true

      - name: npm audit high severity
        run: node scripts/audit-high-check.js
        continue-on-error: true

      - name: Run tests
        run: CI=true npm test -- --watchAll=false --passWithNoTests
        env:
          CI: true
